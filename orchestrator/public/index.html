<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>k6 Orchestrator — Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">k6</span>
      <span class="brand-text">
        <span class="brand-title">Orchestrateur</span>
        <span class="brand-sub">Console de charge distribuée</span>
      </span>
    </div>
    <div class="topbar-right">
      <div class="stat">
        <span class="stat-label">WORKERS</span>
        <span class="stat-value" id="stat-workers">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">LIEN</span>
        <span class="led" id="led-socket" title="Connexion socket.io à l'orchestrateur"></span>
      </div>
    </div>
  </header>

  <main class="grid">
    <aside class="rail">
      <section class="panel reveal d1">
        <h2 class="panel-title">Workers</h2>
        <ul class="workers" id="workers-list">
          <li class="empty" id="workers-empty">Aucun worker connecté…</li>
        </ul>
      </section>

      <section class="panel reveal d2">
        <h2 class="panel-title">Lancer un test</h2>
        <form id="test-form">
          <label class="field">
            <span class="field-label">Script k6 (JavaScript)</span>
            <textarea id="script" class="mono" spellcheck="false"></textarea>
          </label>
          <div class="field-row">
            <label class="field">
              <span class="field-label">VUS totales</span>
              <input id="total-vus" type="number" min="1" value="50" />
            </label>
            <label class="field">
              <span class="field-label">Durée</span>
              <input id="duration" type="text" value="30s" />
            </label>
          </div>
          <div class="field-row actions">
            <button type="submit" class="btn btn-primary" id="btn-start">Lancer le test</button>
            <button type="button" class="btn btn-danger" id="btn-stop">Stop d'urgence</button>
          </div>
          <p class="form-status" id="form-status"></p>
        </form>
      </section>
    </aside>

    <section class="stage">
      <div class="logwrap panel reveal d3">
        <div class="log-head">
          <span class="panel-title inline">Flux de logs — concaténation temps réel</span>
          <span class="log-session mono" id="session-id">—</span>
          <span class="badge idle" id="session-badge"><i class="dot"></i><span id="session-badge-text">En attente</span></span>
          <span class="spacer"></span>
          <span class="log-count"><span id="log-count">0</span> lignes</span>
          <label class="switch">
            <input type="checkbox" id="auto-scroll" checked />
            <span>Auto-scroll</span>
          </label>
          <button class="btn btn-ghost" id="btn-clear" type="button">Vider</button>
        </div>
        <div class="logview" id="logview">
          <pre id="logview-pre" class="logpre"></pre>
          <div class="log-empty"><span>En attente d'un test…</span></div>
        </div>
      </div>

      <div class="report-strip panel reveal d4">
        <span class="panel-title inline">Rapport</span>
        <select id="session-select" class="select" aria-label="Session à exporter">
          <option value="">Aucune session</option>
        </select>
        <span class="report-meta" id="report-meta"></span>
        <button class="btn btn-primary" id="btn-report" disabled>⬇ Télécharger le rapport (.txt)</button>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
